# Mutual TLS: the proxy only completes a connection from a client holding a certificate signed by our CA.
# /mtls/ca.crt is the public CA certificate from make_client_cert.sh (mounted from config/mtls). If it is missing,
# Caddy fails to start rather than silently allowing everyone.
client_auth {
	mode require_and_verify
	trust_pool file /mtls/ca.crt
}
